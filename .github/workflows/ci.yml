# TMS CI — enforced gate (C4 secret-scan + B3 unit tests + logic-port). Runs on push/PR.
# Wires the pipeline agreed with C1 (#7/#12) + C4 (#8/#13). Human Senior Dev merges.
name: ci
on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: gitleaks (secret scan, honors .gitleaks-allowlist) # C4 NFR-SEC-01
        uses: gitleaks/gitleaks-action@v2
        env: { GITLEAKS_CONFIG: .gitleaks-allowlist }

  backend-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21" }
      - name: Set up Gradle (pinned)
        uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.10" }

      # STEP-A: compile gate. Compile errors are the cheapest to surface, so fail fast here.
      - name: compile (main + test)
        working-directory: backend
        run: |
          set -o pipefail
          if ! gradle compileJava compileTestJava --no-daemon --stacktrace > compile.txt 2>&1; then
            grep -nE "\.java:[0-9]+:|error:|cannot find symbol|incompatible types" compile.txt \
              | head -20 | while IFS= read -r l; do echo "::error::COMPILE $l"; done
            exit 1
          fi

      # STEP-B: run the FULL suite (no --tests glob → every test class runs, incl. root-package
      # SecurityConfigTest; a glob split would silently skip anything outside its packages). On failure
      # we parse EVERY JUnit result XML per-class — the <failure>/<error> message + type carries the
      # EXACT root cause (e.g. "No qualifying bean of type '...'"), emitted per class so the M1 / RBAC /
      # security failures stay disambiguated (the class name is in each annotation) without a coverage gap.
      - name: test (full suite), annotate each failing class's root cause
        working-directory: backend
        run: |
          set -o pipefail
          if gradle test --no-daemon --stacktrace > test.txt 2>&1; then
            echo "all test classes PASS"; exit 0
          fi
          echo "::error::backend tests FAILED — per-class root cause below"
          python3 ci/annotate-test-failures.py
          echo "::group::console tail"; tail -30 test.txt; echo "::endgroup::"
          exit 1

  logic-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: M1 read-sync logic verification (5/5)
        run: python3 docs/verify_read_sync_logic.py
