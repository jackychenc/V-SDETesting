# TMS CI — enforced gate (C4 secret-scan + B3 unit tests + logic-port). Runs on push/PR.
# Wires the pipeline agreed with C1 (#7/#12) + C4 (#8/#13). Human Senior Dev merges.
name: ci
on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: gitleaks (secret scan, honors .gitleaks-allowlist) # C4 NFR-SEC-01
        uses: gitleaks/gitleaks-action@v2
        env: { GITLEAKS_CONFIG: .gitleaks-allowlist }

  backend-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21" }
      - name: Set up Gradle (pinned)
        uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.10" }
      # Split into named steps so the FAILING STEP NAME (visible at job level, no log content
      # needed) tells us compile-main vs compile-test vs run-tests — works around the 403 log access.
      - name: STEP-A compile main sources
        working-directory: backend
        run: gradle compileJava --no-daemon --stacktrace
      - name: STEP-B compile test sources
        working-directory: backend
        run: gradle compileTestJava --no-daemon --stacktrace
      - name: STEP-C run unit tests (JUnit — RBAC + M1 read-sync/reconcile/bidi/error-queue)
        working-directory: backend
        run: gradle test --no-daemon --stacktrace --info

  logic-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: M1 read-sync logic verification (5/5)
        run: python3 docs/verify_read_sync_logic.py
