# TMS CI — enforced gate (C4 secret-scan + B3 unit tests + logic-port). Runs on push/PR.
# Wires the pipeline agreed with C1 (#7/#12) + C4 (#8/#13). Human Senior Dev merges.
name: ci
on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: gitleaks (secret scan, honors .gitleaks-allowlist) # C4 NFR-SEC-01
        uses: gitleaks/gitleaks-action@v2
        env: { GITLEAKS_CONFIG: .gitleaks-allowlist }

  backend-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21" }
      - name: Set up Gradle (pinned)
        uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.10" }
      # Emit compile/build errors as ::error:: workflow annotations — these are readable via the
      # PUBLIC check-runs annotations API (logs=403, artifacts=401 to agents; annotations are public).
      - name: build (compile + test), annotate errors
        working-directory: backend
        run: |
          set -o pipefail
          if ! gradle compileJava compileTestJava test --no-daemon --stacktrace > build-output.txt 2>&1; then
            grep -nE "\.java:[0-9]+:|error:|cannot find symbol|No qualifying bean of type|NoSuchBeanDefinitionException|UnsatisfiedDependencyException|Failed to load ApplicationContext|Parameter .* required a bean|Error creating bean with name|expected at least 1 bean|Wanted but not invoked|AssertionFailedError|expected:|but was:| > .* FAILED" build-output.txt \
              | head -40 | while IFS= read -r line; do echo "::error::$line"; done
            # dump a 25-line window around the first root-cause exception for full context
            FIRST=$(grep -nE "No qualifying bean of type|UnsatisfiedDependencyException|Caused by:.*Exception|ApplicationContextException" build-output.txt | head -1 | cut -d: -f1)
            if [ -n "$FIRST" ]; then
              echo "::group::root-cause context"
              sed -n "$((FIRST>3?FIRST-3:1)),$((FIRST+22))p" build-output.txt | while IFS= read -r l; do echo "::error::CTX $l"; done
              echo "::endgroup::"
            fi
            exit 1
          fi

  logic-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: M1 read-sync logic verification (5/5)
        run: python3 docs/verify_read_sync_logic.py
