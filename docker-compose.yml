# Local dev only — PostgreSQL. Password here is a throwaway local default, NOT a real secret.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: tms
      POSTGRES_USER: tms
      # local dev only; overridable, never used by staging/prod (they inject from secret store)
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-devonly-change-me}
    ports: ["5432:5432"]
    volumes: ["tms-pgdata:/var/lib/postgresql/data"]
volumes:
  tms-pgdata:
