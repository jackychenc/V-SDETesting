# Local dev only — PostgreSQL. Password here is a throwaway local default, NOT a real secret.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: tms
      POSTGRES_USER: tms
      POSTGRES_PASSWORD: localdev   # local only; prod/staging inject from secret store
    ports: ["5432:5432"]
    volumes: ["tms-pgdata:/var/lib/postgresql/data"]
volumes:
  tms-pgdata:
