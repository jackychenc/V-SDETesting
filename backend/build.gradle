// TMS backend — Spring Boot 3 (Java 21). Modular monolith + isolated Sync Worker.
// Draft scaffold (PR#1). Senior Developer reviews; agent does not merge.
plugins {
    id 'java'
    id 'org.springframework.boot' version '3.3.2'
    id 'io.spring.dependency-management' version '1.1.6'
}

group = 'com.vgc.tms'
version = '0.1.0-SNAPSHOT'

java {
    toolchain { languageVersion = JavaLanguageVersion.of(21) }
}

repositories { mavenCentral() }

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-security'   // RBAC deny-by-default (REQ-M5-01)
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'   // health endpoint (NFR-AVAIL-01)
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.flywaydb:flyway-core'                                // DB migrations (data model @ G3)
    implementation 'org.flywaydb:flyway-database-postgresql'
    runtimeOnly 'org.postgresql:postgresql'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testImplementation 'org.testcontainers:postgresql:1.20.1'                // integration tests vs real PG
    testImplementation 'org.testcontainers:junit-jupiter:1.20.1'
}

tasks.named('test') { useJUnitPlatform() }
